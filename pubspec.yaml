name: kalakaari
description: Indian Artisan Marketplace - Connecting traditional crafts with modern buyers

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  flutter_staggered_animations: ^1.1.1
  animations: ^2.0.8
  
  # State Management & Data
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  http: ^1.1.0
  
  # Authentication (Firebase temporarily removed for web compatibility)
  # firebase_core: ^2.24.2
  # firebase_auth: ^4.15.3
  # google_sign_in: ^6.1.6
  
  # UI Components
  # carousel_slider: ^4.2.1 # Temporarily removed due to web conflicts
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/backgrounds/
    - assets/artisans/
    
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf